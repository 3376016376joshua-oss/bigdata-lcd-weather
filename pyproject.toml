[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcdweather"
version = "0.1.0"
description = "Hourly weather analysis of ten U.S. cities with NOAA LCD v2, HDFS, Hive and Spark (2010-2025)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5,<3.6",
    "pandas>=1.5,<3",
    # pyspark 3.5 predates NumPy 2 and still uses aliases that NumPy 2 removed.
    "numpy>=1.23,<2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "plotly>=5.15",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
